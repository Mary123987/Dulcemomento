# Crear este servicio requiere un plan de pago y disco persistente en Render.
# No contiene credenciales. La contraseña se introduce en Render al crearlo.
services:
  - type: web
    name: dulce-momento
    runtime: node
    plan: starter
    branch: main
    rootDir: dulce-momento
    buildCommand: node prepare-routes.mjs
    startCommand: node server.mjs
    healthCheckPath: /api/email/status
    disk:
      name: dulce-momento-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: "0.0.0.0"
      - key: BASE_PATH
        value: ""
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: maryrojascordova20@gmail.com
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_DATA_FILE
        value: /var/data/admin-data.json
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        value: https://mary123987.github.io
      - key: EXTERNAL_EMAIL_ENABLED
        value: "false"
